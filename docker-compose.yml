services:
  shopogs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopogs
    ports:
      # An die LAN-Adresse des Pi gebunden statt an 0.0.0.0: der Port wird
      # nur vom Nginx Proxy Manager gebraucht, muss also nicht auf jeder
      # Schnittstelle lauschen. Docker haengt seine Regeln vor die
      # Host-Firewall, deshalb ist die Bindung hier wirksamer als nftables.
      - "192.168.178.48:8090:80"
    restart: unless-stopped
    depends_on:
      - browser-sidecar
    networks:
      - default
      - shared-proxy-net

  browser-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: browser-sidecar
    restart: unless-stopped
    # Kein ports:-Eintrag mehr -- der Sidecar wird ausschliesslich von
    # shopogs ueber das Docker-Netz per Containername angesprochen
    # (nginx.conf: proxy_pass http://browser-sidecar:3001). Ihn auf dem Host
    # zu veroeffentlichen hat nur Angriffsflaeche erzeugt: er rendert fremdes
    # JavaScript und ist damit der exponierteste Teil des Stacks.

  # TLS-Terminierung fuer den internen Zugriff im Heimnetz. Zertifikat von
  # der lokalen mkcert-CA, siehe caddy/Caddyfile. Liegt im Docker-Netz des
  # Projekts und erreicht shopogs ueber den Containernamen -- deshalb braucht
  # shopogs keinen veroeffentlichten Host-Port mehr.
  caddy:
    image: caddy:2-alpine
    container_name: shopogs-caddy
    ports:
      - "192.168.178.48:5443:5443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
    depends_on:
      - shopogs
    restart: unless-stopped

volumes:
  caddy-data:

networks:
  shared-proxy-net:
    external: true
