services:
  shopogs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopogs
    # Kein ports:-Eintrag mehr. Von aussen kommt der Nginx Proxy Manager ueber
    # shared-proxy-net (shopogs:80), im Heimnetz der caddy-Container ueber das
    # Projektnetz -- beide sprechen den Containernamen an, ein Host-Port wird
    # nirgends gebraucht.
    restart: unless-stopped
    depends_on:
      - browser-sidecar
    networks:
      - default
      - shared-proxy-net
    # Verhindert Rechteausweitung ueber setuid-Dateien im Container. nginx
    # ist davon nicht betroffen: der Master startet als root und wechselt per
    # setuid()-Aufruf auf den nginx-Benutzer -- ein Syscall, kein Ausfuehren
    # einer setuid-Datei.
    security_opt:
      - no-new-privileges:true
    # Alle Faehigkeiten entziehen, nur die vier noetigen zurueckgeben:
    #   NET_BIND_SERVICE  Port 80 im Container liegt unter 1024
    #   SETUID / SETGID   Master laeuft als root, Worker als nginx
    #   CHOWN             das Entrypoint-Skript des Images setzt Eigentuemer
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    # Schreibgeschuetztes Wurzeldateisystem, mit drei tmpfs fuer die
    # Bereiche, in die nginx schreiben muss: /run fuer nginx.pid,
    # /var/cache/nginx fuer die Proxy-Zwischenspeicher, /tmp fuer
    # temporaere Dateien. Letzterer ist hier nicht nebensaechlich: die
    # /proxy/-Locations puffern Antworten der Shops zwischen.
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx

  browser-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: browser-sidecar
    restart: unless-stopped
    # Kein ports:-Eintrag mehr -- der Sidecar wird ausschliesslich von
    # shopogs ueber das Docker-Netz per Containername angesprochen
    # (nginx.conf: proxy_pass http://browser-sidecar:3001). Ihn auf dem Host
    # zu veroeffentlichen hat nur Angriffsflaeche erzeugt: er rendert fremdes
    # JavaScript und ist damit der exponierteste Teil des Stacks.
    #
    # Der wichtigste Container fuer diese Option -- und zugleich der mit dem
    # groessten Restrisiko: Camoufox ist ein gepatchter Firefox, dessen
    # Sandbox User-Namespaces nutzt. Setuid-Helfer verwendet sie nicht, das
    # sollte also tragen. Nach dem Setzen unbedingt HHV UND Boomkat suchen --
    # ein Ausfall zeigt sich hier als leeres Ergebnis, nicht als Absturz.
    security_opt:
      - no-new-privileges:true
    # Ein Browser braucht keine Kernel-Faehigkeiten: er bindet keinen
    # privilegierten Port, wechselt keinen Benutzer und fasst keine
    # Netzwerkkonfiguration an. Deshalb alle entziehen und keine
    # zurueckgeben. Falls Camoufox doch nicht startet, waere das an einer
    # Fehlermeldung im Log erkennbar -- nicht an leeren Suchergebnissen.
    cap_drop:
      - ALL
    # Kein Haertungsschritt, sondern Stabilitaet: Firefox legt gemeinsam
    # genutzte Speicherbereiche in /dev/shm ab, und Dockers Vorgabe von
    # 64 MB ist dafuer knapp -- Symptom waeren sporadische Abstuerze unter
    # Last. Der autoplay-pi-Container auf roon-bridge hat das aus demselben
    # Grund.
    shm_size: "1gb"
    #
    # Offen und bewusst nicht hier geloest: Der Container laeuft als root,
    # das Dockerfile setzt kein USER. Das Playwright-Image bringt einen
    # "pwuser" mit -- der Wechsel dorthin waere fuer diesen Container der
    # wirksamste Schritt, verlangt aber Aenderungen am Dockerfile samt
    # Eigentuemerrechten an /opt/camoufox und einen vollstaendigen Neubau.

  # TLS-Terminierung fuer den internen Zugriff im Heimnetz. Zertifikat von
  # der lokalen mkcert-CA, siehe caddy/Caddyfile. Liegt im Docker-Netz des
  # Projekts und erreicht shopogs ueber den Containernamen -- deshalb braucht
  # shopogs keinen veroeffentlichten Host-Port mehr.
  caddy:
    image: caddy:2-alpine
    container_name: shopogs-caddy
    ports:
      # BIND_ADDR steht in der .env (nicht im Repo) und ist die LAN-Adresse
      # des Hosts. Der Vorgabewert 127.0.0.1 ist bewusst restriktiv: ein
      # frischer Klon ohne .env stellt damit nichts versehentlich ins Netz.
      - "${BIND_ADDR:-127.0.0.1}:5443:5443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
    depends_on:
      - shopogs
    security_opt:
      - no-new-privileges:true
    # Keine Faehigkeit noetig: Port 5443 liegt ueber 1024, kein
    # Benutzerwechsel, keine Netzwerkkonfiguration. Setzt voraus, dass
    # caddy/certs/ root gehoert -- cap_drop: ALL nimmt root sonst mit
    # DAC_OVERRIDE die Moeglichkeit, den Schluessel mit Rechten 600 zu lesen.
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  caddy-data:

networks:
  shared-proxy-net:
    external: true
