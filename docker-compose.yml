services:
  shopogs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopogs
    # No ports: entry. Two reverse proxies reach this container by name, and
    # neither needs a host port: from the internet the public Caddy from
    # konzert-guide over shared-proxy-net (shopogs:80), on the home network
    # the caddy container below over the project network.
    #
    # Until 04.08.2026 the first of those was the Nginx Proxy Manager. The
    # network and the container name stayed the same across that switch, which
    # is why nothing here had to change -- only the comment, late.
    restart: unless-stopped
    depends_on:
      - browser-sidecar
      # nginx resolves the name shopogs-api at startup (see location /api/
      # in nginx.conf) and does not even start if it does not exist. The
      # other way round, the API only needs nginx at runtime -- which is why
      # the dependency exists in this direction only. The reverse would make
      # it a cycle, and Compose rejects that.
      - shopogs-api
    networks:
      - default
      - shared-proxy-net
    # Prevents privilege escalation via setuid files in the container. nginx
    # is not affected by this: the master starts as root and switches to the
    # nginx user via a setuid() call -- a syscall, not the execution of a
    # setuid file.
    security_opt:
      - no-new-privileges:true
    # Drop all capabilities, give back only the four that are needed:
    #   NET_BIND_SERVICE  port 80 in the container is below 1024
    #   SETUID / SETGID   master runs as root, workers as nginx
    #   CHOWN             the image's entrypoint script sets ownership
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    # Read-only root filesystem, with three tmpfs for the areas that
    # nginx has to write to: /run for nginx.pid, /var/cache/nginx for
    # the proxy caches, /tmp for temporary files. The last one is not
    # incidental here: the /proxy/ locations buffer the responses from
    # the shops.
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx

  # The JSON API. Runs the same shop adapters that run in the browser -- only
  # server-side, so that the iPhone app gets finished hits instead of raw shop
  # pages. No ports: entry: it is reachable exclusively via nginx (location
  # /api/), on the Docker network by container name.
  shopogs-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: shopogs-api
    restart: unless-stopped
    environment:
      # Points at the nginx container, NOT directly at the shops: that is
      # where header spoofing, the TLS server name and the forwarding of HHV
      # and Boomkat to the sidecar live. Maintaining it twice would mean
      # getting it wrong twice.
      SHOPOGS_PROXY_BASE: http://shopogs
      # The shared secret WaxStock sends as a bearer token. Comes from the
      # .env next to this file, which is not in the repo -- same pattern as
      # BIND_ADDR below.
      #
      # Empty means open, and a fresh clone without a .env therefore behaves
      # as before. That default matters less than it did: /api/ is reachable
      # from the internet through the public Caddy, and a slow search starts
      # a browser per request. The web app is unaffected either way -- it
      # never calls /api/, it goes straight to /proxy/.
      SHOPOGS_API_KEY: ${SHOPOGS_API_KEY:-}
    security_opt:
      - no-new-privileges:true
    # Node needs no kernel capabilities: no privileged port (3002), no user
    # switch (the image starts directly as "node"), no network
    # configuration.
    cap_drop:
      - ALL
    # The process does not have to write anywhere -- it caches nothing and
    # creates nothing. /tmp stays as a tmpfs because Node writes there when
    # it needs to.
    read_only: true
    tmpfs:
      - /tmp

  browser-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: browser-sidecar
    restart: unless-stopped
    # No ports: entry any more -- the sidecar is addressed exclusively by
    # shopogs over the Docker network by container name (nginx.conf:
    # proxy_pass http://browser-sidecar:3001). Publishing it on the host only
    # created attack surface: it renders foreign JavaScript and is therefore
    # the most exposed part of the stack.
    #
    # The most important container for this option -- and at the same time
    # the one with the largest residual risk: Camoufox is a patched Firefox
    # whose sandbox uses user namespaces. It does not use setuid helpers, so
    # this should hold. After setting it, be sure to search HHV AND Boomkat
    # -- a failure shows up here as an empty result, not as a crash.
    security_opt:
      - no-new-privileges:true
    # A browser needs no kernel capabilities: it binds no privileged port,
    # switches no user and does not touch any network configuration. So drop
    # them all and give none back. If Camoufox does not start after all,
    # that would be recognisable from an error message in the log -- not
    # from empty search results.
    cap_drop:
      - ALL
    # Not a hardening step but a matter of stability: Firefox puts shared
    # memory areas in /dev/shm, and Docker's default of 64 MB is tight for
    # that -- the symptom would be sporadic crashes under load. The
    # autoplay-pi container on roon-bridge has this for the same reason.
    shm_size: "1gb"
    #
    # Open and deliberately not solved here: the container runs as root, the
    # Dockerfile sets no USER. The Playwright image ships a "pwuser" -- for
    # this container, switching to it would be the most effective step, but
    # it requires changes to the Dockerfile including ownership of
    # /opt/camoufox, plus a complete rebuild.

  # TLS termination for internal access on the home network. Certificate from
  # the local mkcert CA, see caddy/Caddyfile. Sits on the project's Docker
  # network and reaches shopogs by container name -- which is why shopogs no
  # longer needs a published host port.
  caddy:
    image: caddy:2-alpine
    container_name: shopogs-caddy
    ports:
      # BIND_ADDR is set in the .env (not in the repo) and is the host's LAN
      # address. The default 127.0.0.1 is deliberately restrictive: a fresh
      # clone without a .env does not accidentally expose anything.
      - "${BIND_ADDR:-127.0.0.1}:5443:5443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
    depends_on:
      - shopogs
    security_opt:
      - no-new-privileges:true
    # NET_BIND_SERVICE is not needed for the port -- 5443 is above 1024 --
    # but so that the binary starts at all: the Caddy image sets
    # "setcap cap_net_bind_service=+ep /usr/bin/caddy". The kernel refuses
    # execve when a file carries capabilities that are not in the bounding
    # set, and cap_drop: ALL empties that set.
    #
    # Also a precondition: caddy/certs/ is owned by root. Without
    # DAC_OVERRIDE the container root could otherwise not read the key with
    # mode 600. As a result, renewing certificates only works with sudo.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

volumes:
  caddy-data:

networks:
  shared-proxy-net:
    external: true
